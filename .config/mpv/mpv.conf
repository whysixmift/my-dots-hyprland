# Hardware acceleration for Intel VAAPI
hwdec=vaapi
hwdec-codecs=all

# Performance profile for smooth, lightweight playback
profile=fast
scale=bilinear
cscale=bilinear
dscale=bilinear
interpolation=no
dither-depth=no
correct-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
vf=fps=30
video-sync=display-resample-vdrop
