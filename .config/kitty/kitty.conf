include colors.conf

# remove predefined shortcuts
clear_all_shortcuts yes

# colors
draw_bold_text_with_bright_colors yes

# cursor
cursor_shape beam
cursor_blink_interval 0.55
cursor_stop_blinking_after 15.0

# terminal
term xterm-256color
shell /usr/bin/fish

# scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 6.0

# selection
copy_on_select clipboard
select_by_word_characters :,│`|:\"'()[]{}<>\t

# window
background_opacity 0.7
background_blur 0
window_padding_width 8 8
window_margin_width 0
window_title --title

# fonts
font_family JetBrains Mono NFM
font_size 9.5

# general
allow_remote_control false
enable_audio_bell no

# hints (URL handling)
detect_urls yes
url_prefixes file ftp gemini git gopher http https ipfs ipns magnet mailto news ssh
open_url_with xdg-open

# logging
log_level WARN

# Exit confirm disabled
confirm_os_window_close 0

# Keybindings
map super+shift+enter launch --cwd=current --type=os-window
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font resizing shortcuts (Ctrl + / Ctrl - / Ctrl 0 / Ctrl Shift +)
map ctrl+equal change_font_size all +0.5
map ctrl+plus change_font_size all +0.5
map ctrl+shift+equal change_font_size all +0.5
map ctrl+shift+plus change_font_size all +0.5
map ctrl+minus change_font_size all -0.5
map ctrl+shift+minus change_font_size all -0.5
map ctrl+kp_add change_font_size all +0.5
map ctrl+kp_subtract change_font_size all -0.5
map ctrl+0 change_font_size all 0
map ctrl+backspace change_font_size all 0
